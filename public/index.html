<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LaporWarga</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f9;
      }

      .hero {
        background: linear-gradient(135deg, #0d6efd, #4e73df);
        color: white;
        padding: 60px 20px;
        border-radius: 0 0 30px 30px;
      }

      .card {
        border: none;
        border-radius: 20px;
      }

      .preview-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 15px;
      }

      .card-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 15px;
      }

      .badge-status {
        font-size: 0.8rem;
      }

      .empty-state {
        text-align: center;
        padding: 50px;
        color: gray;
      }

      .loading {
        display: none;
      }

      .preview-click {
        cursor: pointer;
        transition: 0.3s;
      }

      .preview-click:hover {
        transform: scale(1.02);
      }

      .modal-img {
        max-height: 85vh;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <!-- HERO -->
    <div class="hero text-center">
      <h1 class="fw-bold">📢 LaporWarga</h1>

      <p class="mb-0">Sistem Pengaduan Masyarakat Berbasis Cloud Computing</p>
    </div>

    <div class="container py-5">
      <!-- STATS -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm p-4 text-center">
            <h3 id="totalPengaduan">0</h3>

            <p class="mb-0">Total Pengaduan</p>
          </div>
        </div>
      </div>

      <!-- ALERT -->
      <div id="alertBox"></div>

      <!-- FORM -->
      <div class="card shadow p-4 mb-5">
        <h3 class="mb-4">Buat Pengaduan</h3>

        <form id="formPengaduan">
          <div class="mb-3">
            <label class="form-label">Judul</label>

            <input type="text" name="judul" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Deskripsi</label>

            <textarea
              name="deskripsi"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Kategori</label>

            <select name="kategori" class="form-select">
              <option>Jalan Rusak</option>
              <option>Sampah</option>
              <option>Lampu Jalan</option>
              <option>Drainase</option>
              <option>Lainnya</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Upload Foto</label>

            <input
              type="file"
              name="foto"
              id="fotoInput"
              class="form-control"
              accept="image/*"
            />
          </div>

          <!-- PREVIEW -->
          <div class="mb-4">
            <img id="previewImage" class="preview-img d-none" alt="Preview" />
          </div>

          <button class="btn btn-primary w-100">Kirim Pengaduan</button>

          <div class="loading text-center mt-3" id="loading">
            <div class="spinner-border text-primary"></div>
          </div>
        </form>
      </div>

      <!-- DATA -->
      <h3 class="mb-4">📋 Daftar Pengaduan</h3>

      <div id="listPengaduan" class="row"></div>
    </div>

    <!-- IMAGE MODAL -->
    <div class="modal fade" id="imageModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark border-0">
          <div class="modal-body text-center p-2">
            <img id="modalImage" src="" class="img-fluid rounded modal-img" />
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("formPengaduan");

      const list = document.getElementById("listPengaduan");

      const alertBox = document.getElementById("alertBox");

      const loading = document.getElementById("loading");

      const totalPengaduan = document.getElementById("totalPengaduan");

      const fotoInput = document.getElementById("fotoInput");

      const previewImage = document.getElementById("previewImage");

      /* =========================
         PREVIEW IMAGE
      ========================= */

      fotoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];

        if (file) {
          previewImage.src = URL.createObjectURL(file);

          previewImage.classList.remove("d-none");
        }
      });

      /* =========================
         ALERT
      ========================= */

      function showAlert(message, type = "success") {
        alertBox.innerHTML = `
          <div class="alert alert-${type} alert-dismissible fade show">

            ${message}

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>

          </div>
        `;
      }

      /* =========================
         FORMAT DATE
      ========================= */

      function formatDate(dateString) {
        const date = new Date(dateString);

        return date.toLocaleString("id-ID");
      }

      /* =========================
         OPEN IMAGE MODAL
      ========================= */

      function openImage(url) {
        document.getElementById("modalImage").src = url;

        const modal = new bootstrap.Modal(
          document.getElementById("imageModal"),
        );

        modal.show();
      }

      /* =========================
         LOAD DATA
      ========================= */

      async function loadData() {
        try {
          const res = await fetch("/api/pengaduan");

          const data = await res.json();

          totalPengaduan.innerText = data.length;

          list.innerHTML = "";

          if (data.length === 0) {
            list.innerHTML = `
              <div class="empty-state">
                <h5>Belum ada pengaduan</h5>
              </div>
            `;

            return;
          }

          data.forEach((item) => {
            list.innerHTML += `
              <div class="col-md-4 mb-4">

                <div class="card shadow-sm p-3 h-100">

                  ${
                    item.foto_url
                      ? `
                        <img
                          src="${item.foto_url}"
                          class="card-img mb-3 preview-click"
                          onclick="openImage('${item.foto_url}')"
                          onerror="this.style.display='none'"
                        />
                      `
                      : ""
                  }

                  <h5>${item.judul}</h5>

                  <p>${item.deskripsi}</p>

                  <div class="mb-2">

                    <span class="badge bg-primary">
                      ${item.kategori}
                    </span>

                    <span class="badge bg-warning text-dark badge-status">
                      ${item.status_pengaduan || "Pending"}
                    </span>

                  </div>

                  <small class="text-muted">
                    ${formatDate(item.created_at)}
                  </small>

                </div>

              </div>
            `;
          });
        } catch (error) {
          console.log(error);

          showAlert("Gagal mengambil data", "danger");
        }
      }

      /* =========================
         SUBMIT
      ========================= */

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        loading.style.display = "block";

        const formData = new FormData(form);

        try {
          const res = await fetch("/api/pengaduan", {
            method: "POST",
            body: formData,
          });

          const result = await res.json();

          loading.style.display = "none";

          if (result.success) {
            showAlert(result.message, "success");

            form.reset();

            previewImage.classList.add("d-none");

            loadData();
          } else {
            showAlert(result.message, "danger");
          }
        } catch (error) {
          console.log(error);

          loading.style.display = "none";

          showAlert("Server error", "danger");
        }
      });

      loadData();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
