<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LaporWarga</title>

    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- LEAFLET -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
      body {
        background: #f4f6f9;
      }

      .hero {
        background: linear-gradient(135deg, #0d6efd, #4e73df);

        color: white;

        padding: 60px 20px;

        border-radius: 0 0 30px 30px;
      }

      .card {
        border: none;
        border-radius: 20px;
      }

      .preview-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 15px;
      }

      .card-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 15px;
      }

      .preview-click {
        cursor: pointer;
        transition: 0.3s;
      }

      .preview-click:hover {
        transform: scale(1.02);
      }

      .modal-img {
        max-height: 80vh;
        object-fit: contain;
      }

      .empty-state {
        text-align: center;
        padding: 50px;
        color: gray;
      }

      .loading {
        display: none;
      }

      #map {
        height: 300px;
        border-radius: 15px;
      }

      video {
        border-radius: 15px;
      }
    </style>
  </head>

  <body>
    <!-- HERO -->
    <div class="hero text-center">
      <h1 class="fw-bold">📢 LaporWarga</h1>

      <p class="mb-0">Sistem Pengaduan Masyarakat Berbasis Cloud</p>
    </div>

    <div class="container py-5">
      <!-- STATS -->
      <div class="row mb-4">
        <div class="col-md-4 mb-3">
          <div class="card shadow-sm p-4 text-center">
            <h3 id="totalData">0</h3>

            <p class="mb-0">Total Pengaduan</p>
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <div class="card shadow-sm p-4 text-center">
            <h3 id="pendingData">0</h3>

            <p class="mb-0">Pending</p>
          </div>
        </div>

        <div class="col-md-4 mb-3">
          <div class="card shadow-sm p-4 text-center">
            <h3 id="kategoriData">0</h3>

            <p class="mb-0">Kategori</p>
          </div>
        </div>
      </div>

      <!-- FILTER -->
      <div class="card shadow p-4 mb-4">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Cari pengaduan..."
            />
          </div>

          <div class="col-md-6 mb-3">
            <select id="filterKategori" class="form-select">
              <option>Semua</option>

              <option>Jalan Rusak</option>

              <option>Sampah</option>

              <option>Lampu Jalan</option>

              <option>Drainase</option>

              <option>Lainnya</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ALERT -->
      <div id="alertBox"></div>

      <!-- FORM -->
      <div class="card shadow p-4 mb-5">
        <h3 class="mb-4">Buat Pengaduan</h3>

        <form id="formPengaduan">
          <!-- JUDUL -->
          <div class="mb-3">
            <label class="form-label"> Judul </label>

            <input type="text" name="judul" class="form-control" required />
          </div>

          <!-- DESKRIPSI -->
          <div class="mb-3">
            <label class="form-label"> Deskripsi </label>

            <textarea
              name="deskripsi"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>

          <!-- KATEGORI -->
          <div class="mb-3">
            <label class="form-label"> Kategori </label>

            <select name="kategori" class="form-select">
              <option>Jalan Rusak</option>

              <option>Sampah</option>

              <option>Lampu Jalan</option>

              <option>Drainase</option>

              <option>Lainnya</option>
            </select>
          </div>

          <!-- MAP -->
          <div class="mb-3">
            <label class="form-label"> Pilih Lokasi (Opsional) </label>

            <div id="map"></div>
          </div>

          <!-- LOKASI -->
          <div class="mb-3">
            <label class="form-label"> Lokasi (Opsional) </label>

            <input
              type="text"
              name="lokasi"
              class="form-control"
              placeholder="Contoh: Jl. Soekarno Hatta"
            />
          </div>

          <!-- FILE -->
          <div class="mb-3">
            <label class="form-label"> Upload File </label>

            <input
              type="file"
              name="file"
              id="fileInput"
              class="form-control"
              accept="image/*,video/*,.pdf,.doc,.docx"
            />
          </div>

          <!-- PREVIEW -->
          <div class="mb-4">
            <img id="previewImage" class="preview-img d-none" alt="Preview" />

            <video id="previewVideo" controls class="w-100 d-none"></video>
          </div>

          <!-- BUTTON -->
          <button class="btn btn-primary w-100">Kirim Pengaduan</button>

          <!-- LOADING -->
          <div class="loading text-center mt-3" id="loading">
            <div class="spinner-border text-primary"></div>
          </div>
        </form>
      </div>

      <!-- DATA -->
      <h3 class="mb-4">📋 Daftar Pengaduan</h3>

      <div id="listPengaduan" class="row"></div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="imageModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-dark border-0">
          <div class="modal-body text-center p-3">
            <img
              id="modalImage"
              src=""
              class="img-fluid rounded modal-img mb-3"
            />

            <div>
              <a
                id="downloadBtn"
                href=""
                target="_blank"
                download
                class="btn btn-light"
              >
                Download File
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- LEAFLET -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  </body>
  <script>
    const form = document.getElementById("formPengaduan");

    const list = document.getElementById("listPengaduan");

    const alertBox = document.getElementById("alertBox");

    const loading = document.getElementById("loading");

    const fileInput = document.getElementById("fileInput");

    const previewImage = document.getElementById("previewImage");

    const previewVideo = document.getElementById("previewVideo");

    const searchInput = document.getElementById("searchInput");

    const filterKategori = document.getElementById("filterKategori");

    /* =========================
         FILE PREVIEW
      ========================= */

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];

      if (!file) return;

      previewImage.classList.add("d-none");

      previewVideo.classList.add("d-none");

      if (file.type.startsWith("image")) {
        previewImage.src = URL.createObjectURL(file);

        previewImage.classList.remove("d-none");
      } else if (file.type.startsWith("video")) {
        previewVideo.src = URL.createObjectURL(file);

        previewVideo.classList.remove("d-none");
      }
    });


    function downloadFile(url) {

        const a =
            document.createElement("a");

        a.href = url;

        a.download = "";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);
    }

    /* =========================
         ALERT
      ========================= */

    function showAlert(message, type = "success") {
      alertBox.innerHTML = `
          <div class="alert alert-${type} alert-dismissible fade show">

            ${message}

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>

          </div>
        `;
    }

    /* =========================
         IMAGE MODAL
      ========================= */

    function openImage(url) {
      document.getElementById("modalImage").src = url;

      document.getElementById("downloadBtn").href = url;

      const modal = new bootstrap.Modal(document.getElementById("imageModal"));

      modal.show();
    }

    /* =========================
         LOAD STATS
      ========================= */

    async function loadStats() {
      try {
        const res = await fetch("/api/stats");

        const data = await res.json();

        document.getElementById("totalData").innerText = data.total;

        document.getElementById("pendingData").innerText = data.pending;

        document.getElementById("kategoriData").innerText = data.kategori;
      } catch (error) {
        console.log(error);
      }
    }

    /* =========================
         LOAD DATA
      ========================= */

    async function loadData() {
      try {
        const kategori = filterKategori.value;

        const search = searchInput.value;

        const res = await fetch(
          `/api/pengaduan?kategori=${kategori}&search=${search}`,
        );

        const data = await res.json();

        list.innerHTML = "";

        if (data.length === 0) {
          list.innerHTML = `
              <div class="empty-state">
                <h5>Belum ada pengaduan</h5>
              </div>
            `;

          return;
        }

        data.forEach((item) => {
          let media = "";

          /* IMAGE */

          if (item.file_type && item.file_type.startsWith("image")) {
            media = `
                <div class="position-relative">

                  <img
                    src="${item.foto_url}"
                    class="card-img mb-3 preview-click"
                    onclick="openImage('${item.foto_url}')"
                  />

                    <button
                        onclick="downloadFile('${item.foto_url}')"
                        class="btn btn-dark btn-sm position-absolute bottom-0 end-0 m-2"
                    >
                        Download
                    </button>
                  
                </div>
              `;
          } else if (item.file_type && item.file_type.startsWith("video")) {
            /* VIDEO */
            media = `
                <video
                  controls
                  class="w-100 mb-3"
                >
                  <source src="${item.foto_url}" />
                </video>
              `;
          } else if (item.foto_url) {
            /* DOCUMENT */
            media = `
                <a
                  href="${item.foto_url}"
                  target="_blank"
                  class="btn btn-dark mb-3"
                >
                  Download File
                </a>
              `;
          }

          list.innerHTML += `
              <div class="col-md-4 mb-4">

                <div class="card shadow-sm p-3 h-100">

                  ${media}

                  <h5>${item.judul}</h5>

                  <p>${item.deskripsi}</p>

                  ${
                    item.lokasi
                      ? `
                        <p>
                          📍 ${item.lokasi}
                        </p>
                      `
                      : ""
                  }

                  <div class="mb-2">

                    <span class="badge bg-primary">
                      ${item.kategori}
                    </span>

                  </div>

                  <small class="text-muted">
                    ${new Date(item.created_at).toLocaleString("id-ID")}
                  </small>

                </div>

              </div>
            `;
        });
      } catch (error) {
        console.log(error);

        showAlert("Gagal mengambil data", "danger");
      }
    }

    /* =========================
         SEARCH + FILTER
      ========================= */

    searchInput.addEventListener("keyup", loadData);

    filterKategori.addEventListener("change", loadData);

    /* =========================
         SUBMIT
      ========================= */

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      loading.style.display = "block";

      const formData = new FormData(form);

      try {
        const res = await fetch("/api/pengaduan", {
          method: "POST",
          body: formData,
        });

        const result = await res.json();

        loading.style.display = "none";

        if (result.success) {
          showAlert(result.message, "success");

          form.reset();

          previewImage.classList.add("d-none");

          previewVideo.classList.add("d-none");

          loadData();
          loadStats();
        } else {
          showAlert(result.message, "danger");
        }
      } catch (error) {
        console.log(error);

        loading.style.display = "none";

        showAlert("Server error", "danger");
      }
    });

    /* =========================
         MAP
      ========================= */

    const map = L.map("map").setView([-6.914744, 107.60981], 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    let marker;

    map.on("click", function (e) {
      const lat = e.latlng.lat.toFixed(6);

      const lng = e.latlng.lng.toFixed(6);

      const lokasiInput = document.querySelector('input[name="lokasi"]');

      lokasiInput.value = `${lat}, ${lng}`;

      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.marker([lat, lng]).addTo(map);
    });

    loadData();
    loadStats();
  </script>
  </body>
</html>
