<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaporWarga</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f9;
      }

      .hero {
        background: linear-gradient(135deg, #0d6efd, #4e73df);
        color: white;
        padding: 60px 20px;
        border-radius: 0 0 30px 30px;
      }

      .card {
        border: none;
        border-radius: 20px;
      }

      .preview-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 15px;
      }
    </style>
  </head>

  <body>
    <!-- HERO -->
    <div class="hero text-center">
      <h1 class="fw-bold">📢 LaporWarga</h1>
      <p>Sistem Pengaduan Masyarakat Berbasis Cloud</p>
    </div>

    <div class="container py-5">
      <!-- FORM -->
      <div class="card shadow p-4 mb-5">
        <h3 class="mb-4">Buat Pengaduan</h3>

        <form id="formPengaduan">
          <div class="mb-3">
            <label class="form-label">Judul</label>
            <input type="text" name="judul" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Deskripsi</label>
            <textarea
              name="deskripsi"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Kategori</label>

            <select name="kategori" class="form-select">
              <option>Jalan Rusak</option>
              <option>Sampah</option>
              <option>Lampu Jalan</option>
              <option>Drainase</option>
              <option>Lainnya</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="form-label">Upload Foto</label>
            <input
              type="file"
              name="foto"
              class="form-control"
              accept="image/*"
            />
          </div>

          <button class="btn btn-primary w-100">Kirim Pengaduan</button>
        </form>
      </div>

      <!-- DATA -->
      <h3 class="mb-4">📋 Daftar Pengaduan</h3>

      <div id="listPengaduan" class="row"></div>
    </div>

    <script>
      const form = document.getElementById("formPengaduan");
      const list = document.getElementById("listPengaduan");

      // LOAD DATA
      async function loadData() {
        try {
          const res = await fetch("/api/pengaduan");
          const data = await res.json();

          list.innerHTML = "";

          data.forEach((item) => {
            list.innerHTML += `
            <div class="col-md-4 mb-4">
              <div class="card shadow-sm p-3">

                ${
                  item.foto_url
                    ? `<img src="${item.foto_url}" class="preview-img mb-3">`
                    : ""
                }

                <h5>${item.judul}</h5>

                <p>${item.deskripsi}</p>

                <span class="badge bg-primary mb-2">
                  ${item.kategori}
                </span>

                <span class="badge bg-warning text-dark">
                  ${item.status}
                </span>

              </div>
            </div>
          `;
          });
        } catch (error) {
          console.log(error);
        }
      }

      // SUBMIT
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        try {
          const res = await fetch("/api/pengaduan", {
            method: "POST",
            body: formData,
          });

          const result = await res.text();

          alert(result);

          form.reset();

          loadData();
        } catch (error) {
          console.log(error);
        }
      });

      loadData();
    </script>
  </body>
</html>
