name: Deploy to ECR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        run: docker build -t laporwarga .

      - name: Tag Docker Image
        run: docker tag laporwarga:latest 604006981701.dkr.ecr.ap-southeast-2.amazonaws.com/laporwarga:latest

      - name: Push Docker Image to ECR
        run: docker push 604006981701.dkr.ecr.ap-southeast-2.amazonaws.com/laporwarga:latest
